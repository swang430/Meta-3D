openapi: 3.0.3
info:
  title: MIMO OTA Control API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /api/v1/dashboard:
    get:
      summary: Get dashboard summary metrics
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/v1/monitoring/feeds:
    get:
      summary: Get monitoring metric feeds
      responses:
        '200':
          description: Monitoring metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringFeedsResponse'
  /api/v1/instruments/catalog:
    get:
      summary: List instrument categories and models
      responses:
        '200':
          description: Instrument catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentsResponse'
  /api/v1/instruments/{categoryKey}:
    put:
      summary: Update instrument selection or connection
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstrumentPayload'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentCategoryResponse'
  /api/v1/instruments/{categoryKey}/topology-profiles:
    get:
      summary: List operator-selectable topology profiles for a binding (P2-1)
      description: |
        Two-layer UXM architecture (P2-1 Phase 1):
        - Test App layer = SCPI command vocabulary, AUTO-DETECTED at
          connect via `SYSTem:APPLication:NAME?`. Operator does not pick.
        - Topology profile layer = cell/MIMO/power/FRC configuration
          within the running Test App. Operator-picked, persisted in
          `InstrumentConnection.connection_params['topology_profile_id']`,
          auto-applied on HAL reload.
        The `compatible_with_current_test_app` flag per item reflects
        the live HAL driver's detected_test_app — GUI greys out
        incompatible options. Empty `compatible_test_apps` on a profile
        means "compatible with any Test App" (no constraint).
        Only `baseStation` category exposes profiles today (UXM
        specific); other categories return empty + `reason="not_a_uxm"`.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Topology profile list + live compat status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfilesListResult'
        '404':
          description: Category not found
    put:
      summary: Operator selects (or clears) the topology profile for a binding (P2-1)
      description: |
        - `profile_id=null` clears the selection.
        - `profile_id="known_id"` with no live driver: persists; takes
          effect on next HAL reload.
        - `profile_id="known_id"` + live driver + compatible: persists
          AND immediately applies on the driver. Response carries
          `applied_now=true`.
        - `profile_id="known_id"` + live driver + INCOMPATIBLE: returns
          409 with `refused: true` + structured reason. Binding is NOT
          persisted (refuses bail before DB write so operator can't
          save a doomed selection). Matches the P2-5 refuse pattern.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectTopologyProfileRequest'
      responses:
        '200':
          description: Selection persisted (and optionally applied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectTopologyProfileResult'
        '404':
          description: Category, connection, or profile_id not found
        '409':
          description: Topology incompatible with detected Test App
    post:
      summary: Create a new operator-owned topology profile (P2-1 Phase 2.1)
      description: |
        `profile_id` is auto-allocated (`custom_<slug>`) — operators
        don't pick raw IDs (prevents collisions with built-ins and
        slug-formatting surprises). Returns the full row including the
        assigned ID so the GUI can pre-select it.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopologyProfileRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '400':
          description: Bad request — empty name or unknown field
        '404':
          description: Category does not host topology profiles
  /api/v1/instruments/{categoryKey}/topology-profiles/{profileId}:
    get:
      summary: Get full detail for a single topology profile (P2-1 Phase 2.2)
      description: |
        Returns the full 25+ field row so the GUI editor modal can
        populate the form. The list endpoint returns only the
        truncated `TopologyProfileEntry`; this endpoint returns the
        full `TopologyProfileDetail`.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full profile detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '404':
          description: Profile not found
    put:
      summary: Update an operator-owned topology profile (P2-1 Phase 2.1)
      description: |
        Partial-update. Refuses `is_system_preset=true` rows with 409 —
        operator must duplicate first. Unknown field keys return 400.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopologyProfileRequest'
      responses:
        '200':
          description: Updated row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '400':
          description: Bad request — unknown field
        '404':
          description: Profile not found
        '409':
          description: System preset — duplicate to edit
    delete:
      summary: Delete an operator-owned topology profile (P2-1 Phase 2.1)
      description: |
        Refuses `is_system_preset=true` rows with 409. Does NOT touch
        bindings — if a category has the profile bound via
        `connection_params['topology_profile_id']`, that selection
        silently becomes stale on next HAL reload (HAL warns + skips
        auto-apply). GUI should warn before delete if bindings exist.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Profile not found
        '409':
          description: System preset — cannot delete
  /api/v1/instruments/{categoryKey}/topology-profiles/{profileId}/duplicate:
    post:
      summary: Clone any topology profile into a new editable copy (P2-1 Phase 2.1)
      description: |
        Supported source for both system presets and operator-owned
        rows. The new copy has `is_system_preset=false` (always) and
        a `(副本)` suffix on the name so it's visually distinct in the
        dropdown. Useful for the GUI's "duplicate-to-edit" flow on a
        system preset.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: New editable copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '404':
          description: Source profile not found
  /api/v1/instruments/hal/readiness:
    get:
      summary: HAL composite readiness snapshot (P3-5)
      description: |
        Returns the snapshot built during the last HAL initialise / reload:
        per-driver rows (category, model, endpoint, status, detail, plus
        driver-specific `extras` like F64 firmware_version), the active
        LabProfile state, the active calibration certificate validity,
        and a DUT-attach placeholder. `available=false` means HAL is not
        initialised yet — the sub-sections carry placeholders, the GUI
        should render "HAL not ready" rather than consuming them as live.
        Sibling HAL endpoints (`/hal/status`, `/hal/reload`, `/hal/switch`)
        are not currently in this contract; the GUI consumes them via
        inline-typed `axios.get`. Bringing them under generated types is
        out of scope for P3-5.
      responses:
        '200':
          description: Readiness snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HALReadinessResponse'
  /api/v1/test-executions:
    get:
      summary: List test plan execution history (P2-8 cockpit run zone)
      description: |
        Terminal-state execution rows (completed / failed / cancelled),
        newest first by completed_at. This is HISTORY — not a live-running
        stream. The cockpit "最近执行" zone polls this with limit=5.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, failed, cancelled]
      responses:
        '200':
          description: Execution history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionListResponse'
  /api/v1/system-logs/tail:
    get:
      summary: Tail a structured log file (P2-8 cockpit log zone)
      description: |
        Reverse-reads the last N lines of a JSON-lines log file and parses
        each into a structured entry, with optional level / keyword /
        session filtering applied after read.
      parameters:
        - name: filename
          in: query
          schema:
            type: string
            default: app.log
        - name: lines
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 2000
        - name: level
          in: query
          schema:
            type: string
          description: Exact level match (DEBUG/INFO/WARNING/ERROR)
        - name: keyword
          in: query
          schema:
            type: string
          description: Fuzzy match against msg + logger
        - name: session_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Parsed tail page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogTailResponse'
  /api/v1/dashboard/alerts:
    get:
      summary: List active alerts ordered by severity (P2-8 cockpit alert zone)
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Defaults to active when omitted
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error, critical]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Alert page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAlertListResponse'
  /api/v1/dashboard/alerts/summary:
    get:
      summary: Active-alert counts by severity (P2-8 cockpit alert tally)
      responses:
        '200':
          description: Alert summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAlertSummary'
components:
  schemas:
    DashboardResponse:
      type: object
      properties:
        systemStatus:
          type: array
          items:
            $ref: '#/components/schemas/SystemStatusItem'
        activeAlerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertItem'
        liveMetrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricItem'
      required: [systemStatus, activeAlerts, liveMetrics]
    MonitoringFeedsResponse:
      type: object
      properties:
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/MetricItem'
      required: [feeds]
    InstrumentsResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentCategory'
      required: [categories]
    InstrumentCategoryResponse:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/InstrumentCategory'
      required: [category]
    UpdateInstrumentPayload:
      type: object
      properties:
        modelId:
          type: string
          nullable: true
        connection:
          $ref: '#/components/schemas/InstrumentConnection'
      additionalProperties: false
    SystemStatusItem:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
      required: [label, value, detail]
    AlertItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        timestamp:
          type: string
      required: [id, title, severity, timestamp]
    MetricItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
        trend:
          type: string
      required: [label, value]
    InstrumentCategory:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        selectedModelId:
          type: string
          nullable: true
        connection:
          $ref: '#/components/schemas/InstrumentConnection'
        models:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentModel'
      required: [key, label, description, selectedModelId, connection, models]
    InstrumentModel:
      type: object
      properties:
        id:
          type: string
        vendor:
          type: string
        model:
          type: string
        summary:
          type: string
        interfaces:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        model_capabilities:
          type: array
          items:
            type: string
          description: |
            P2-3: canonical capability tokens this model CAN expose
            (per DriverClass.model_capabilities ClassVar). Distinct
            from the freeform datasheet-derived `capabilities` badges
            above. Empty list means either no real driver is
            registered for the model, or the driver intentionally
            declared no tokens. Used by GUI to gate plan-binding
            picks before HAL Reload (closes the P1-1 pre-flight gap
            of needing a connected driver to know what it'd support).
          default: []
        bandwidth:
          type: string
          nullable: true
        channels:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, reserved, maintenance, offline, pending_dev]
          description: |
            Catalog availability status.
            - `available`: real driver class registered + HAL can bring it up
            - `pending_dev`: catalog row exists but no real driver class
              is registered yet (`_convert_model` in `app/api/instrument.py`
              maps to this when `get_real_driver_class()` returns None).
              Distinct from `offline` (which means "driver registered but
              not currently reachable") — operators picking a model need to
              see these as two different states so they don't try to
              connect to a model that fundamentally has no driver.
            - `offline` / `reserved` / `maintenance`: operational states
              for driver-backed models.
      required: [id, vendor, model, summary, interfaces, capabilities, status]
    InstrumentConnection:
      type: object
      properties:
        endpoint:
          type: string
          nullable: true
        controller:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      additionalProperties: false
    HALReadinessResponse:
      type: object
      description: |
        P3-5 composite snapshot. `available=false` means HAL is not
        initialised; sub-sections still carry valid shapes (with
        placeholder values) so the GUI never has to handle a 404 or
        missing-field path.
      properties:
        available:
          type: boolean
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/DriverReadinessRow'
        lab_profile:
          $ref: '#/components/schemas/LabProfileReadiness'
        calibration:
          $ref: '#/components/schemas/CalibrationReadiness'
        dut_attach:
          $ref: '#/components/schemas/DutAttachReadiness'
        generated_at_iso:
          type: string
      required: [available, drivers, lab_profile, calibration, dut_attach, generated_at_iso]
    DriverReadinessRow:
      type: object
      properties:
        category:
          type: string
        model:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [ok, fail, skipped]
        detail:
          type: string
        extras:
          type: object
          description: |
            Driver-specific metadata (string-keyed). F64 surfaces
            firmware_version / band_label / product_family from the
            parsed SYST:INFO? response (P3-4); other drivers return an
            empty object until they override `readiness_metadata()`.
            Field values may be null when a driver field is unpopulated.
          additionalProperties: true
          default: {}
      required: [category, model, endpoint, status, detail]
    LabProfileReadiness:
      type: object
      description: |
        Active LabProfile state. `status` distinguishes "no profiles at
        all" (`missing`) from "profiles exist but none active"
        (`inactive`) — different operator next-steps.
      properties:
        profile_id:
          type: string
          nullable: true
        profile_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        status:
          type: string
          enum: [ok, inactive, missing, ambiguous]
        detail:
          type: string
      required: [is_active, status, detail]
    CalibrationReadiness:
      type: object
      description: |
        Validity of the active lab's bound calibration certificate.
        `no_lab` (no lab to look at a cert through) is distinct from
        `missing` (lab exists but cert FK is NULL) — the former hints
        "set up lab first", the latter hints "run calibration".
      properties:
        certificate_number:
          type: string
          nullable: true
        valid_until_iso:
          type: string
          nullable: true
        status:
          type: string
          enum: [valid, expired, missing, no_lab]
        days_remaining:
          type: integer
          nullable: true
        detail:
          type: string
      required: [status, detail]
    DutAttachReadiness:
      type: object
      description: |
        DUT-attach state — placeholder in this build. `status` is
        always `not_implemented` since no runtime model exists for
        "DUT present in chamber" (no probe-sensing / RFID / session
        table). Field is in the contract so future probe-sensing
        work can land without breaking the response shape.
      properties:
        status:
          type: string
        detail:
          type: string
      required: [status, detail]
    TestExecutionItem:
      type: object
      description: |
        P2-8: one terminal-state execution row. Mirrors api-service
        TestPlanExecutionResponse.
      properties:
        id:
          type: string
        test_plan_id:
          type: string
        test_plan_name:
          type: string
        test_plan_version:
          type: string
        status:
          type: string
          enum: [completed, failed, cancelled]
        total_steps:
          type: integer
        completed_steps:
          type: integer
        failed_steps:
          type: integer
        skipped_steps:
          type: integer
        success_rate:
          type: number
        started_at:
          type: string
        completed_at:
          type: string
        duration_minutes:
          type: number
        error_summary:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        started_by:
          type: string
        created_at:
          type: string
      required:
        - id
        - test_plan_id
        - test_plan_name
        - test_plan_version
        - status
        - total_steps
        - completed_steps
        - failed_steps
        - skipped_steps
        - success_rate
        - started_at
        - completed_at
        - duration_minutes
        - started_by
        - created_at
    TestExecutionListResponse:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestExecutionItem'
      required: [total, items]
    SystemLogEntry:
      type: object
      description: |
        P2-8: one parsed log line. `level` is RAW for non-JSON continuation
        lines (e.g. Python traceback follow-ups). `raw` holds the original
        JSON line for detail expansion.
      properties:
        ts:
          type: string
        level:
          type: string
        logger:
          type: string
        hal_mode:
          type: string
        session_id:
          type: string
        instrument_id:
          type: string
        msg:
          type: string
        raw:
          type: string
          nullable: true
      required: [ts, level, logger, hal_mode, session_id, instrument_id, msg]
    SystemLogTailResponse:
      type: object
      properties:
        filename:
          type: string
        total_lines_read:
          type: integer
        filtered_count:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SystemLogEntry'
      required: [filename, total_lines_read, filtered_count, entries]
    DashboardAlert:
      type: object
      description: |
        P2-8: one alert row. Mirrors api-service AlertResponse. `severity`
        is the operator-facing color key (info < warning < error < critical).
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
          nullable: true
        severity:
          type: string
          enum: [info, warning, error, critical]
        alert_type:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        status:
          type: string
        is_read:
          type: boolean
        related_entity_type:
          type: string
          nullable: true
        related_entity_id:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        acknowledged_at:
          type: string
          nullable: true
        resolved_at:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        acknowledged_by:
          type: string
          nullable: true
      required: [id, title, severity, status, is_read, created_at, updated_at]
    DashboardAlertListResponse:
      type: object
      properties:
        total:
          type: integer
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAlert'
      required: [total, alerts]
    DashboardAlertSummary:
      type: object
      properties:
        total_active:
          type: integer
        info_count:
          type: integer
        warning_count:
          type: integer
        error_count:
          type: integer
        critical_count:
          type: integer
      required: [total_active, info_count, warning_count, error_count, critical_count]
    TopologyProfileEntry:
      type: object
      description: |
        P2-1: one row in the topology profile listing.
        `compatible_with_current_test_app` is null when there's no
        live driver to check against (HAL not initialised, mock mode,
        no UXM driver bound) — GUI should treat null as "unknown,
        allow selection but warn".
      properties:
        profile_id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        compatible_test_apps:
          type: array
          items:
            type: string
        compatible_with_current_test_app:
          type: boolean
          nullable: true
        is_system_preset:
          type: boolean
          description: |
            P2-1 Phase 2.1: true for the 7 built-ins seeded by the
            bootstrap seeder. GUI renders these as read-only with a
            'duplicate to edit' affordance (clone-to-edit pattern).
      required: [profile_id, name, description, category, compatible_test_apps]
    TopologyProfilesListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopologyProfileEntry'
        current_test_app:
          type: string
          nullable: true
        selected_topology_profile_id:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          description: |
            `"not_a_uxm"` when the category doesn't host topology
            profiles (today everything except baseStation); otherwise
            null. Future categories (CMX500 etc.) extend the dispatch
            in `_list_topology_profiles_for_category`.
      required: [items]
    SelectTopologyProfileRequest:
      type: object
      properties:
        profile_id:
          type: string
          nullable: true
          description: |
            Topology profile ID to bind to this category. Null clears
            the selection so HAL reload won't auto-apply anything.
    SelectTopologyProfileResult:
      type: object
      properties:
        persisted:
          type: boolean
        profile_id:
          type: string
          nullable: true
        applied_now:
          type: boolean
        apply_skipped_reason:
          type: string
          nullable: true
