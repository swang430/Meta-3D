openapi: 3.0.3
info:
  title: MIMO OTA Control API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /api/v1/dashboard:
    get:
      summary: Get dashboard summary metrics
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/v1/monitoring/feeds:
    get:
      summary: Get monitoring metric feeds
      responses:
        '200':
          description: Monitoring metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringFeedsResponse'
  /api/v1/instruments/catalog:
    get:
      summary: List instrument categories and models
      responses:
        '200':
          description: Instrument catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentsResponse'
  /api/v1/instruments/{categoryKey}:
    put:
      summary: Update instrument selection or connection
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstrumentPayload'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentCategoryResponse'
  /api/v1/instruments/{categoryKey}/topology-profiles:
    get:
      summary: List operator-selectable topology profiles for a binding (P2-1)
      description: |
        Two-layer UXM architecture (P2-1 Phase 1):
        - Test App layer = SCPI command vocabulary, AUTO-DETECTED at
          connect via `SYSTem:APPLication:NAME?`. Operator does not pick.
        - Topology profile layer = cell/MIMO/power/FRC configuration
          within the running Test App. Operator-picked, persisted in
          `InstrumentConnection.connection_params['topology_profile_id']`,
          auto-applied on HAL reload.
        The `compatible_with_current_test_app` flag per item reflects
        the live HAL driver's detected_test_app — GUI greys out
        incompatible options. Empty `compatible_test_apps` on a profile
        means "compatible with any Test App" (no constraint).
        Only `baseStation` category exposes profiles today (UXM
        specific); other categories return empty + `reason="not_a_uxm"`.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Topology profile list + live compat status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfilesListResult'
        '404':
          description: Category not found
    put:
      summary: Operator selects (or clears) the topology profile for a binding (P2-1)
      description: |
        - `profile_id=null` clears the selection.
        - `profile_id="known_id"` with no live driver: persists; takes
          effect on next HAL reload.
        - `profile_id="known_id"` + live driver + compatible: persists
          AND immediately applies on the driver. Response carries
          `applied_now=true`.
        - `profile_id="known_id"` + live driver + INCOMPATIBLE: returns
          409 with `refused: true` + structured reason. Binding is NOT
          persisted (refuses bail before DB write so operator can't
          save a doomed selection). Matches the P2-5 refuse pattern.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectTopologyProfileRequest'
      responses:
        '200':
          description: Selection persisted (and optionally applied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectTopologyProfileResult'
        '404':
          description: Category, connection, or profile_id not found
        '409':
          description: Topology incompatible with detected Test App
  /api/v1/instruments/hal/readiness:
    get:
      summary: HAL composite readiness snapshot (P3-5)
      description: |
        Returns the snapshot built during the last HAL initialise / reload:
        per-driver rows (category, model, endpoint, status, detail, plus
        driver-specific `extras` like F64 firmware_version), the active
        LabProfile state, the active calibration certificate validity,
        and a DUT-attach placeholder. `available=false` means HAL is not
        initialised yet — the sub-sections carry placeholders, the GUI
        should render "HAL not ready" rather than consuming them as live.
        Sibling HAL endpoints (`/hal/status`, `/hal/reload`, `/hal/switch`)
        are not currently in this contract; the GUI consumes them via
        inline-typed `axios.get`. Bringing them under generated types is
        out of scope for P3-5.
      responses:
        '200':
          description: Readiness snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HALReadinessResponse'
components:
  schemas:
    DashboardResponse:
      type: object
      properties:
        systemStatus:
          type: array
          items:
            $ref: '#/components/schemas/SystemStatusItem'
        activeAlerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertItem'
        liveMetrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricItem'
      required: [systemStatus, activeAlerts, liveMetrics]
    MonitoringFeedsResponse:
      type: object
      properties:
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/MetricItem'
      required: [feeds]
    InstrumentsResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentCategory'
      required: [categories]
    InstrumentCategoryResponse:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/InstrumentCategory'
      required: [category]
    UpdateInstrumentPayload:
      type: object
      properties:
        modelId:
          type: string
          nullable: true
        connection:
          $ref: '#/components/schemas/InstrumentConnection'
      additionalProperties: false
    SystemStatusItem:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
      required: [label, value, detail]
    AlertItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        timestamp:
          type: string
      required: [id, title, severity, timestamp]
    MetricItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
        trend:
          type: string
      required: [label, value]
    InstrumentCategory:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        selectedModelId:
          type: string
          nullable: true
        connection:
          $ref: '#/components/schemas/InstrumentConnection'
        models:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentModel'
      required: [key, label, description, selectedModelId, connection, models]
    InstrumentModel:
      type: object
      properties:
        id:
          type: string
        vendor:
          type: string
        model:
          type: string
        summary:
          type: string
        interfaces:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        model_capabilities:
          type: array
          items:
            type: string
          description: |
            P2-3: canonical capability tokens this model CAN expose
            (per DriverClass.model_capabilities ClassVar). Distinct
            from the freeform datasheet-derived `capabilities` badges
            above. Empty list means either no real driver is
            registered for the model, or the driver intentionally
            declared no tokens. Used by GUI to gate plan-binding
            picks before HAL Reload (closes the P1-1 pre-flight gap
            of needing a connected driver to know what it'd support).
          default: []
        bandwidth:
          type: string
          nullable: true
        channels:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, reserved, maintenance, offline, pending_dev]
          description: |
            Catalog availability status.
            - `available`: real driver class registered + HAL can bring it up
            - `pending_dev`: catalog row exists but no real driver class
              is registered yet (`_convert_model` in `app/api/instrument.py`
              maps to this when `get_real_driver_class()` returns None).
              Distinct from `offline` (which means "driver registered but
              not currently reachable") — operators picking a model need to
              see these as two different states so they don't try to
              connect to a model that fundamentally has no driver.
            - `offline` / `reserved` / `maintenance`: operational states
              for driver-backed models.
      required: [id, vendor, model, summary, interfaces, capabilities, status]
    InstrumentConnection:
      type: object
      properties:
        endpoint:
          type: string
          nullable: true
        controller:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      additionalProperties: false
    HALReadinessResponse:
      type: object
      description: |
        P3-5 composite snapshot. `available=false` means HAL is not
        initialised; sub-sections still carry valid shapes (with
        placeholder values) so the GUI never has to handle a 404 or
        missing-field path.
      properties:
        available:
          type: boolean
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/DriverReadinessRow'
        lab_profile:
          $ref: '#/components/schemas/LabProfileReadiness'
        calibration:
          $ref: '#/components/schemas/CalibrationReadiness'
        dut_attach:
          $ref: '#/components/schemas/DutAttachReadiness'
        generated_at_iso:
          type: string
      required: [available, drivers, lab_profile, calibration, dut_attach, generated_at_iso]
    DriverReadinessRow:
      type: object
      properties:
        category:
          type: string
        model:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [ok, fail, skipped]
        detail:
          type: string
        extras:
          type: object
          description: |
            Driver-specific metadata (string-keyed). F64 surfaces
            firmware_version / band_label / product_family from the
            parsed SYST:INFO? response (P3-4); other drivers return an
            empty object until they override `readiness_metadata()`.
            Field values may be null when a driver field is unpopulated.
          additionalProperties: true
          default: {}
      required: [category, model, endpoint, status, detail]
    LabProfileReadiness:
      type: object
      description: |
        Active LabProfile state. `status` distinguishes "no profiles at
        all" (`missing`) from "profiles exist but none active"
        (`inactive`) — different operator next-steps.
      properties:
        profile_id:
          type: string
          nullable: true
        profile_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        status:
          type: string
          enum: [ok, inactive, missing, ambiguous]
        detail:
          type: string
      required: [is_active, status, detail]
    CalibrationReadiness:
      type: object
      description: |
        Validity of the active lab's bound calibration certificate.
        `no_lab` (no lab to look at a cert through) is distinct from
        `missing` (lab exists but cert FK is NULL) — the former hints
        "set up lab first", the latter hints "run calibration".
      properties:
        certificate_number:
          type: string
          nullable: true
        valid_until_iso:
          type: string
          nullable: true
        status:
          type: string
          enum: [valid, expired, missing, no_lab]
        days_remaining:
          type: integer
          nullable: true
        detail:
          type: string
      required: [status, detail]
    DutAttachReadiness:
      type: object
      description: |
        DUT-attach state — placeholder in this build. `status` is
        always `not_implemented` since no runtime model exists for
        "DUT present in chamber" (no probe-sensing / RFID / session
        table). Field is in the contract so future probe-sensing
        work can land without breaking the response shape.
      properties:
        status:
          type: string
        detail:
          type: string
      required: [status, detail]
    TopologyProfileEntry:
      type: object
      description: |
        P2-1: one row in the topology profile listing.
        `compatible_with_current_test_app` is null when there's no
        live driver to check against (HAL not initialised, mock mode,
        no UXM driver bound) — GUI should treat null as "unknown,
        allow selection but warn".
      properties:
        profile_id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        compatible_test_apps:
          type: array
          items:
            type: string
        compatible_with_current_test_app:
          type: boolean
          nullable: true
      required: [profile_id, name, description, category, compatible_test_apps]
    TopologyProfilesListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopologyProfileEntry'
        current_test_app:
          type: string
          nullable: true
        selected_topology_profile_id:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          description: |
            `"not_a_uxm"` when the category doesn't host topology
            profiles (today everything except baseStation); otherwise
            null. Future categories (CMX500 etc.) extend the dispatch
            in `_list_topology_profiles_for_category`.
      required: [items]
    SelectTopologyProfileRequest:
      type: object
      properties:
        profile_id:
          type: string
          nullable: true
          description: |
            Topology profile ID to bind to this category. Null clears
            the selection so HAL reload won't auto-apply anything.
    SelectTopologyProfileResult:
      type: object
      properties:
        persisted:
          type: boolean
        profile_id:
          type: string
          nullable: true
        applied_now:
          type: boolean
        apply_skipped_reason:
          type: string
          nullable: true
          description: |
            Non-null when the binding was persisted but the driver
            was NOT live-applied. Values: `no_selection` (cleared),
            `no_live_driver` (HAL not initialised), `driver_does_not_support_topology_profiles`
            (e.g. mock driver), `incompatible_test_app` (compat check
            failed at the driver level — usually caught earlier as 409).
        test_app:
          type: string
          nullable: true
      required: [persisted, applied_now]
