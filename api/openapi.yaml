          type: string
          format: uuid
          nullable: true
        channel_emulator_id:
          type: string
          nullable: true
        calibrated_by:
          type: string
        use_mock:
          type: boolean
          default: true
          description: >-
            True = reference-plus-noise synthetic spectrum (default). False =
            real instrument path via measure_doppler_spectrum (P1-70).
