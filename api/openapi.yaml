    LteRmcMacTestProfileV1:
      type: object
      additionalProperties: false
      properties:
        schema_version: {type: integer, const: 1}
        profile_version: {type: integer, const: 1}
        test_intent: {type: string, const: downlink_throughput}
        mimo_layers: {type: integer, const: 2}
        statistical_window: {$ref: '#/components/schemas/MacStatisticalWindow'}
        metric_requirements:
          type: array
          items: {$ref: '#/components/schemas/MacMetricRequirement'}
        source_reference:
          type: string
          const: Instrument_API_Doc/R&S CMW500/CMW_LTE_UE_UserManual_V4-0-250_en_41 (2).pdf
        kind: {type: string, const: lte_rmc}
        rat: {type: string, const: lte}
        scheduling_mode: {type: string, const: rmc}
        resource_allocation: {type: string, const: full}
        enable_amc: {type: boolean, const: false}
        duplex: {type: string, enum: [fdd, tdd]}
        transmission_mode: {type: string, const: TM3}
        # P2-56 ②：LTE TDD 专属维度，取值域已放开。
        # 出处：ULDL pp.687-688 `0 to 6` / SSUBframe p.688 `0 to 9` /
        # RMC:VERSion:DL p.803 `0 to 1`。
        # ⚠️ special_subframe 只到 7，不是手册的 9：值 8/9 要求 normal cyclic
        # prefix，而本 profile 没有 cyclic prefix 维度。
        # null = 该维度不适用（duplex=fdd 时恒为 null）。
        # 三个键**恒出现**（序列化不带 exclude_none），故进 required。
        uldl_configuration: {type: integer, nullable: true, enum: [null, 0, 1, 2, 3, 4, 5, 6]}
        special_subframe: {type: integer, nullable: true, enum: [null, 0, 1, 2, 3, 4, 5, 6, 7]}
        rmc_version: {type: integer, nullable: true, enum: [null, 0, 1]}
      required: [schema_version, profile_version, test_intent, mimo_layers, statistical_window, metric_requirements, source_reference, kind, rat, scheduling_mode, resource_allocation, enable_amc, duplex, transmission_mode, uldl_configuration, special_subframe, rmc_version]
