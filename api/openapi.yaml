      required: [execution_id, status, phase_progress]
    SystemLogEntry:
      type: object
      description: |
        P2-8: one parsed log line. `level` is RAW for non-JSON continuation
        lines (e.g. Python traceback follow-ups). `raw` holds the original
        JSON line for detail expansion.
      properties:
        ts:
          type: string
        level:
          type: string
        logger:
          type: string
        hal_mode:
          type: string
        session_id:
          type: string
        execution_id:
          type: string
        instrument_id:
          type: string
        msg:
          type: string
        raw:
          type: string
          nullable: true
      required: [ts, level, logger, hal_mode, session_id, execution_id, instrument_id, msg, raw]
    SystemLogTailResponse:
      type: object
      properties:
        filename:
          type: string
        total_lines_read:
          type: integer
        filtered_count:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SystemLogEntry'
        older_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next older page; null at file start
        has_older:
          type: boolean
          description: Whether an explicit history request can continue
      required: [filename, total_lines_read, filtered_count, entries, older_cursor, has_older]
    DashboardAlert:
      type: object
      description: |
        P2-8: one alert row. Mirrors api-service AlertResponse. `severity`
        is the operator-facing color key (info < warning < error < critical).
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
          nullable: true
        severity:
          type: string
          enum: [info, warning, error, critical]
        alert_type:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        status:
          type: string
        is_read:
          type: boolean
        related_entity_type:
          type: string
          nullable: true
        related_entity_id:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        acknowledged_at:
          type: string
          nullable: true
        resolved_at:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        acknowledged_by:
          type: string
          nullable: true
      required: [id, title, severity, status, is_read, created_at, updated_at]
    DashboardAlertListResponse:
      type: object
      properties:
        total:
          type: integer
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAlert'
      required: [total, alerts]
    DashboardAlertSummary:
      type: object
      properties:
        total_active:
          type: integer
        info_count:
          type: integer
        warning_count:
          type: integer
        error_count:
          type: integer
        critical_count:
          type: integer
      required: [total_active, info_count, warning_count, error_count, critical_count]
    TopologyProfileEntry:
      type: object
      description: |
        P2-1: one row in the topology profile listing.
        `compatible_with_current_test_app` is null when there's no
        live driver to check against (HAL not initialised, mock mode,
        no UXM driver bound) — GUI should treat null as "unknown,
        allow selection but warn".
      properties:
        profile_id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        compatible_test_apps:
          type: array
          items:
            type: string
        compatible_with_current_test_app:
          type: boolean
          nullable: true
        is_system_preset:
          type: boolean
          description: |
            P2-1 Phase 2.1: true for the 7 built-ins seeded by the
            bootstrap seeder. GUI renders these as read-only with a
            'duplicate to edit' affordance (clone-to-edit pattern).
      required: [profile_id, name, description, category, compatible_test_apps]
    TopologyProfilesListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopologyProfileEntry'
        current_test_app:
          type: string
          nullable: true
        selected_topology_profile_id:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          description: |
            `"not_a_uxm"` when the category doesn't host topology
            profiles (today everything except baseStation); otherwise
            null. Future categories (CMX500 etc.) extend the dispatch
            in `_list_topology_profiles_for_category`.
      required: [items]
    SelectTopologyProfileRequest:
      type: object
      properties:
        profile_id:
          type: string
          nullable: true
          description: |
            Topology profile ID to bind to this category. Null clears
            the selection so HAL reload won't auto-apply anything.
    SelectTopologyProfileResult:
      type: object
      properties:
        persisted:
          type: boolean
        profile_id:
          type: string
          nullable: true
        applied_now:
          type: boolean
        apply_skipped_reason:
          type: string
          nullable: true
          description: |
            Non-null when the binding was persisted but the driver
            was NOT live-applied. Values: `no_selection` (cleared),
            `no_live_driver` (HAL not initialised), `driver_does_not_support_topology_profiles`
            (e.g. mock driver), `incompatible_test_app` (compat check
            failed at the driver level — usually caught earlier as 409).
        test_app:
          type: string
          nullable: true
      required: [persisted, applied_now]
