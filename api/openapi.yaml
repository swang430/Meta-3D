openapi: 3.0.3
info:
  title: MIMO OTA Control API
  version: 0.9.0
servers:
  - url: http://localhost:3000
paths:
  /api/v1/test-plans/cases/{test_case_id}/execution-policy:
    put:
      summary: Update TestCase Diagnostic/Formal policy
      parameters:
        - name: test_case_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestCaseExecutionPolicyUpdate'}
      responses:
        '200':
          description: Audited server-owned TestCase policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestCaseExecutionPolicyResponse'}
        '422': {description: Validation error}
  /api/v1/instruments/connections/{connection_id}/base-station-site-certification:
    put:
      summary: Certify BaseStation site from one completed execution
      parameters:
        - name: connection_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BaseStationSiteCertificationCreate'}
      responses:
        '200':
          description: Server-derived site certification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaseStationSiteCertification'}
        '422': {description: Validation error}
  /api/v1/instruments/connections/{connection_id}/base-station-site-certification/revoke:
    put:
      summary: Revoke current BaseStation site certification
      parameters:
        - name: connection_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BaseStationSiteCertificationRevoke'}
      responses:
        '200':
          description: Revoked site certification audit row
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaseStationSiteCertification'}
        '422': {description: Validation error}
  /api/v1/instruments/connections/{connection_id}/formal-capabilities/cmw500-lte-2x2:
    put:
      summary: Explicitly enable or disable CMW500 LTE 2x2 formal admission
      description: |
        The only write path for the durable CMW500 LTE 2x2 rollout approval.
        Generic connection fields and connection_params cannot enable it.
        The selected category/model are locked and must resolve to the registered
        CMW500 base-station adapter.
      parameters:
        - name: connection_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Cmw500FormalCapabilityUpdate'}
      responses:
        '200':
          description: Server-owned approval state and timestamp
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cmw500FormalCapabilityResponse'}
        '404': {description: Instrument connection not found}
        '422': {description: Connection is not the selected registered CMW500 base station}
  /api/v1/dashboard:
    get:
      summary: Get dashboard summary metrics
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/v1/monitoring/feeds:
    get:
      summary: Get monitoring metric feeds
      responses:
        '200':
          description: Monitoring metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringFeedsResponse'
  /api/v1/instruments/catalog:
    get:
      summary: List instrument categories and models
      responses:
        '200':
          description: Instrument catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentsResponse'
  /api/v1/instruments/{categoryKey}:
    put:
      summary: Update instrument selection or connection
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstrumentPayload'
      responses:
        '200':
          description: Updated category (平铺 — live 实现不包 category 层, P3-17 G11)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentCategory'
  /api/v1/lab-profiles/{lab_profile_id}/instrument-bindings/{category_key}/sync-current:
    put:
      summary: Sync one current instrument configuration into an existing LabProfile
      description: >-
        Explicitly replaces one category binding with the catalog's saved selected
        model, connection endpoint, and driver mode while preserving other bindings.
      parameters:
        - name: lab_profile_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: category_key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Persisted binding and vendor-neutral BaseStation resolution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstrumentBindingSyncResponse'}
        '404': {description: LabProfile or instrument category not found}
        '422': {description: Current instrument model or endpoint is incomplete}
  /api/v1/lab-profiles/{lab_profile_id}/instrument-bindings/baseStation/preview:
    get:
      summary: Preview the resolved BaseStation binding without instrument I/O
      parameters:
        - name: lab_profile_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current immutable BaseStation binding projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaseStationBindingPreviewResponse'}
        '404': {description: LabProfile not found}
  /api/v1/instruments/{categoryKey}/channel-models:
    get:
      summary: List typed channel-model entries
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Channel-model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelModelsListResult' }
    post:
      summary: Add an explicitly typed channel-model entry
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddChannelModelRequest' }
      responses:
        '200':
          description: Updated channel-model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelModelsListResult' }
  /api/v1/instruments/{categoryKey}/topology-profile:
    put:
      summary: Operator selects (or clears) the topology profile for a binding (P2-1)
      description: |
        P3-17 G11: 本操作曾错挂在复数集合路径 /topology-profiles 上 — live
        实现的选择端点是单数 /topology-profile (集合路径只有 GET/POST)。
        - `profile_id=null` clears the selection.
        - `profile_id="known_id"` with no live driver: persists; takes
          effect on next HAL reload.
        - `profile_id="known_id"` + live driver + compatible: persists
          AND immediately applies on the driver. Response carries
          `applied_now=true`.
        - `profile_id="known_id"` + live driver + INCOMPATIBLE: returns
          409 with `refused: true` + structured reason. Binding is NOT
          persisted (refuses bail before DB write so operator can't
          save a doomed selection). Matches the P2-5 refuse pattern.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectTopologyProfileRequest'
      responses:
        '200':
          description: Selection persisted (and optionally applied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectTopologyProfileResult'
        '404':
          description: Category, connection, or profile_id not found
        '409':
          description: Topology incompatible with detected Test App
  /api/v1/instruments/{categoryKey}/topology-profiles:
    get:
      summary: List operator-selectable topology profiles for a binding (P2-1)
      description: |
        Two-layer UXM architecture (P2-1 Phase 1):
        - Test App layer = SCPI command vocabulary, AUTO-DETECTED at
          connect via `SYSTem:APPLication:NAME?`. Operator does not pick.
        - Topology profile layer = cell/MIMO/power/FRC configuration
          within the running Test App. Operator-picked, persisted in
          `InstrumentConnection.connection_params['topology_profile_id']`,
          auto-applied on HAL reload.
        The `compatible_with_current_test_app` flag per item reflects
        the live HAL driver's detected_test_app — GUI greys out
        incompatible options. Empty `compatible_test_apps` on a profile
        means "compatible with any Test App" (no constraint).
        Only `baseStation` category exposes profiles today (UXM
        specific); other categories return empty + `reason="not_a_uxm"`.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Topology profile list + live compat status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfilesListResult'
        '404':
          description: Category not found
    post:
      summary: Create a new operator-owned topology profile (P2-1 Phase 2.1)
      description: |
        `profile_id` is auto-allocated (`custom_<slug>`) — operators
        don't pick raw IDs (prevents collisions with built-ins and
        slug-formatting surprises). Returns the full row including the
        assigned ID so the GUI can pre-select it.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopologyProfileRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '400':
          description: Bad request — empty name or unknown field
        '404':
          description: Category does not host topology profiles
  /api/v1/instruments/{categoryKey}/topology-profiles/{profileId}:
    get:
      summary: Get full detail for a single topology profile (P2-1 Phase 2.2)
      description: |
        Returns the full 25+ field row so the GUI editor modal can
        populate the form. The list endpoint returns only the
        truncated `TopologyProfileEntry`; this endpoint returns the
        full `TopologyProfileDetail`.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full profile detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '404':
          description: Profile not found
    put:
      summary: Update an operator-owned topology profile (P2-1 Phase 2.1)
      description: |
        Partial-update. Refuses `is_system_preset=true` rows with 409 —
        operator must duplicate first. Unknown field keys return 400.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopologyProfileRequest'
      responses:
        '200':
          description: Updated row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '400':
          description: Bad request — unknown field
        '404':
          description: Profile not found
        '409':
          description: System preset — duplicate to edit
    delete:
      summary: Delete an operator-owned topology profile (P2-1 Phase 2.1)
      description: |
        Refuses `is_system_preset=true` rows with 409. Does NOT touch
        bindings — if a category has the profile bound via
        `connection_params['topology_profile_id']`, that selection
        silently becomes stale on next HAL reload (HAL warns + skips
        auto-apply). GUI should warn before delete if bindings exist.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Profile not found
        '409':
          description: System preset — cannot delete
  /api/v1/instruments/{categoryKey}/topology-profiles/{profileId}/duplicate:
    post:
      summary: Clone any topology profile into a new editable copy (P2-1 Phase 2.1)
      description: |
        Supported source for both system presets and operator-owned
        rows. The new copy has `is_system_preset=false` (always) and
        a `(副本)` suffix on the name so it's visually distinct in the
        dropdown. Useful for the GUI's "duplicate-to-edit" flow on a
        system preset.
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: New editable copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyProfileDetail'
        '404':
          description: Source profile not found
  /api/v1/instruments/hal/readiness:
    get:
      summary: HAL composite readiness snapshot (P3-5)
      description: |
        Returns HAL-owned per-driver rows from the last initialise / reload
        together with request-time LabProfile and calibration readiness.
        An explicit `lab_profile_id` selects that exact active profile;
        omitting it keeps the unique-active compatibility behaviour.
        `available=false` means HAL-owned driver/subnet data is unavailable,
        while the database-only LabProfile and calibration sections remain live.
        Sibling HAL endpoints (`/hal/status`, `/hal/reload`, `/hal/switch`)
        are not currently in this contract; the GUI consumes them via
        inline-typed `axios.get`. Bringing them under generated types is
        out of scope for P3-5.
      parameters:
        - name: lab_profile_id
          in: query
          required: false
          description: Current browser-selected active LabProfile; no implicit fallback when supplied.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Readiness snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HALReadinessResponse'
  /api/v1/test-executions:
    get:
      summary: List execution history (ARCH-1 S2, sourced from test_executions)
      description: |
        One row per execution from the test_executions table itself
        (case-runner / commissioning / diagnostics; VRT rows excluded),
        newest first by executed_at. Includes RUNNING rows — the test case
        library uses status=running to restore the active-run badge after
        navigation (Codex #237 C3). Row id is TestExecution.id and can be
        passed directly as a report's test_execution_ids.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: status
          in: query
          description: |
            Row status. Covers every value test_executions.status can hold
            for non-VRT rows: pending (session row not yet run), running,
            completed, failed, cancelled, skipped (ad-hoc phase skipped).
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled, skipped]
        - name: executed_by
          in: query
          description: |
            Filter by execution chain (test_case_runner / test_plan_runner /
            commissioning_api / commissioning_adhoc). Repeatable — pass the
            parameter once per chain to match any of them.

            Narrowing MUST happen here rather than client-side: client-side
            filtering runs after the limit window, so a chain with many rows
            crowds out the wanted ones. Two instances so far — the case
            library's active-run recovery passes test_case_runner (stale
            plan-runner running rows would crowd it out), and the
            pending-report list passes the three formal chains (ad-hoc
            diagnostics would crowd out archivable executions).
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Execution history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionListResponse'
  /api/v1/test-plans/cases:
    get:
      summary: List reusable TestCases
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: test_type
          in: query
          schema:
            type: string
        - name: is_template
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: TestCase page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseListResponse'
    post:
      summary: Create a reusable TestCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseCreate'
      responses:
        '201':
          description: Created TestCase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseResponse'
        '422':
          description: Invalid TestCase payload
  /api/v1/test-plans/cases/{test_case_id}:
    parameters:
      - name: test_case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one TestCase
      responses:
        '200':
          description: TestCase detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseResponse'
        '404':
          description: TestCase not found
    patch:
      summary: Update one TestCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseUpdate'
      responses:
        '200':
          description: Updated TestCase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseResponse'
        '404':
          description: TestCase not found
        '422':
          description: Invalid TestCase payload
    delete:
      summary: Delete one TestCase
      responses:
        '204':
          description: TestCase deleted
        '404':
          description: TestCase not found
  /api/v1/test-plans/cases/executions/{execution_id}:
    get:
      summary: Get one TestCase execution status and sanitized SCPI evidence
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Execution status with P1-47C evidence when available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseExecutionStatus'
        '404':
          description: Execution not found
  /api/v1/system-logs/tail:
    get:
      summary: Tail a structured log file (P2-8 cockpit log zone)
      description: |
        Reverse-scans a JSON-lines log file from the end, applying the
        optional level / keyword / session filters during the scan, until
        N matching entries are collected (or a bounded scan limit is hit).
        With filters active the window is therefore "newest N matching
        lines", so sparse WARNING/ERROR entries are not flushed out by
        high-frequency INFO noise.
      parameters:
        - name: filename
          in: query
          schema:
            type: string
            default: app.log
        - name: lines
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 2000
        - name: level
          in: query
          schema:
            type: string
          description: >-
            Comma-separated set of levels (e.g. `WARNING,ERROR,CRITICAL`).
            Exact membership match, NOT a threshold — ZoneLogsAlerts' cross-stream
            dedup relies on level streams being disjoint; do not change to >=.
        - name: keyword
          in: query
          schema:
            type: string
          description: >-
            Fuzzy match against msg + logger + the same-line `exception` field
            (where JsonFormatter puts tracebacks) + RAW continuation lines of the
            group; a hit anywhere returns the whole group (parent + continuations).
        - name: session_id
          in: query
          schema:
            type: string
          description: Exact match on the per-request correlation id
        - name: execution_id
          in: query
          schema:
            type: string
          description: >-
            Exact match on the per-test-execution correlation id. Distinct from
            session_id: one execution spans multiple requests and may run
            outside any request (background task).
      responses:
        '200':
          description: Parsed tail page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogTailResponse'
  /api/v1/system-logs/history:
    get:
      summary: Read an explicitly requested older log page (P1-43)
      description: |
        Continues a reverse scan from the opaque cursor returned by `/tail`
        or a previous history page. This endpoint is for explicit operator
        actions only and must not be placed on the live polling path. An empty
        filtered page can still return a newer cursor so sparse matches remain
        reachable without an unbounded single request.
      parameters:
        - name: cursor
          in: query
          required: true
          schema:
            type: string
          description: Opaque continuation cursor returned by the server
        - name: filename
          in: query
          schema:
            type: string
            default: app.log
        - name: lines
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 2000
        - name: level
          in: query
          schema:
            type: string
          description: Comma-separated exact-match level set
        - name: keyword
          in: query
          schema:
            type: string
          description: Same scope as /tail keyword (msg + logger + same-line exception + RAW continuations; whole group returned)
        - name: session_id
          in: query
          schema:
            type: string
        - name: execution_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One older log page and its continuation cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogTailResponse'
        '400':
          description: Malformed or unsupported cursor
        '409':
          description: Cursor no longer matches the selected log snapshot
  /api/v1/dashboard/alerts:
    get:
      summary: List active alerts ordered by severity (P2-8 cockpit alert zone)
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Defaults to active when omitted
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error, critical]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Alert page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAlertListResponse'
  /api/v1/dashboard/alerts/summary:
    get:
      summary: Active-alert counts by severity (P2-8 cockpit alert tally)
      responses:
        '200':
          description: Alert summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAlertSummary'
  /api/v1/commissioning/sessions:
    post:
      summary: Create a commissioning session with one explicit LTE/NR PCell
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201': { description: Session created }
  /api/v1/standard-channels:
    get:
      summary: List typed standard-channel definitions
      parameters:
        - name: instrument_connection_id
          in: query
          required: false
          schema: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Standard channels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SCDResponse' }
    post:
      summary: Create an explicitly typed standard-channel definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SCDCreateRequest' }
      responses:
        '201':
          description: Standard channel created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SCDResponse' }
  /api/v1/channel-assets/vendor-files/smu-scan:
    post:
      summary: Preview mounted F64 .smu project truth
      description: >-
        Read-only bounded scan of the server-configured SMB mount. The client cannot submit a
        path, frequency, ARFCN, or cached preview.
      responses:
        '200':
          description: Exact-path synchronization preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMUProjectSyncPreviewResponse'
        '409':
          description: Scan configuration missing, ambiguous, unsafe, or bounded scan failed
  /api/v1/channel-assets/vendor-files/smu-sync:
    post:
      summary: Synchronize mounted F64 .smu project truth
      description: >-
        Re-scans server-side and atomically updates only exact, registered, provable matches. The
        client cannot supply truth in a request body.
      responses:
        '200':
          description: Synchronization result and post-commit preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMUProjectSyncResultResponse'
        '409':
          description: Scan or synchronization failed without partial writes
  /api/v1/calibration/path-loss/rf-chain/uplink:
    post:
      summary: Start RF chain uplink gain calibration (P1-68 real reachable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRFChainCalibrationRequest'
      responses:
        '200':
          description: Calibration job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationJobResponse'
  /api/v1/calibration/path-loss/rf-chain/downlink:
    post:
      summary: Start RF chain downlink gain calibration (P1-68 real reachable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRFChainCalibrationRequest'
      responses:
        '200':
          description: Calibration job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationJobResponse'
  /api/v1/calibration/path-loss/multi-frequency/start:
    post:
      summary: Start multi-frequency path-loss calibration (real = CE+SA sweep)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMultiFrequencyPathLossRequest'
      responses:
        '200':
          description: Calibration job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationJobResponse'
  /api/v1/calibration/phase/calibrate:
    post:
      summary: Phase calibration entry (fail-loud closed since P1-68)
      responses:
        '409':
          description: >-
            PFS is power-only (TR 37.977 F.2); phase calibration belongs to a
            future PWS. Entry refuses and no mock rows are generated.
  /api/v1/calibration/probe/phase/start:
    post:
      summary: Probe phase calibration mock entry (fail-loud closed since P1-68)
      responses:
        '409':
          description: >-
            Mock-generation entry closed; external measured phase data must go
            through POST /api/v1/calibration/probe/phase/import-csv.
  /api/v1/calibration/channel/temporal/start:
    post:
      summary: Start temporal (PDP) channel validation (P1-70 real reachable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTemporalCalibrationRequest'
      responses:
        '202':
          description: Calibration job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCalibrationJobResponse'
  /api/v1/calibration/channel/doppler/start:
    post:
      summary: Start Doppler spectrum channel validation (P1-70 real reachable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDopplerCalibrationRequest'
      responses:
        '202':
          description: Calibration job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCalibrationJobResponse'
  /api/v1/calibration/orchestrator/plan/{chamber_id}:
    get:
      summary: Get calibration plan (use_mock exposed since P1-70)
      parameters:
        - name: chamber_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: use_mock
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Calibration plan
  /api/v1/calibration/orchestrator/execute/{chamber_id}:
    post:
      summary: Execute calibration plan (use_mock exposed since P1-70)
      parameters:
        - name: chamber_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: frequency_mhz
          in: query
          schema:
            type: number
            default: 3500.0
        - name: calibrated_by
          in: query
          required: true
          schema:
            type: string
        - name: sgh_model
          in: query
          schema:
            type: string
            default: Generic SGH
        - name: sgh_gain_dbi
          in: query
          schema:
            type: number
            default: 10.0
        - name: items
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
        - name: use_mock
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Execution result
components:
