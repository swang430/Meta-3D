            type: string
        formal_verdict:
          type: string
          enum: [passed, rejected, unknown]
        formal_acceptance:
          type: boolean
        reason:
          type: string
      required:
        - schema_version
        - execution_id
        - environments
        - required
        - items
        - missing_requirements
        - formal_verdict
        - formal_acceptance
        - reason
    CaseExecutionStatus:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        status:
          type: string
        source_test_case_id:
          type: string
          nullable: true
        phase_progress:
          type: array
          items:
            type: object
            additionalProperties: true
