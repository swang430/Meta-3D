          type: string
          default: auto
      required: [categoryId, key, label, description, tags, selectedModelId, connection, models, isActive, usagePhase, driverMode]
    InstrumentModel:
      type: object
      properties:
        id:
          type: string
        vendor:
          type: string
        model:
          type: string
        summary:
          type: string
        interfaces:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        model_capabilities:
          type: array
          items:
            type: string
          description: |
            P2-3: canonical capability tokens this model CAN expose
            (per DriverClass.model_capabilities ClassVar). Distinct
            from the freeform datasheet-derived `capabilities` badges
            above. Empty list means either no real driver is
            registered for the model, or the driver intentionally
            declared no tokens. Used by GUI to gate plan-binding
            picks before HAL Reload (closes the P1-1 pre-flight gap
            of needing a connected driver to know what it'd support).
          default: []
        bandwidth:
          type: string
          nullable: true
        channels:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, pending_dev]
          description: |
            Catalog availability status.
            - `available`: real driver class registered + HAL can bring it up
            - `pending_dev`: catalog row exists but no real driver class
              is registered yet (`_convert_model` in `app/api/instrument.py`
              maps to this when `get_real_driver_class()` returns None).
              Operators picking a model must see this distinctly so they do
              not try to connect to a model that has no registered driver.
      required: [id, vendor, model, summary, interfaces, capabilities, model_capabilities, bandwidth, channels, status]
    InstrumentConnection:
      type: object
      properties:
        id:
          type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
        controller:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        connection_params:
          type: object
          nullable: true
          additionalProperties: true
      required: [id, endpoint, controller, notes, connection_params]
      additionalProperties: false
    HALReadinessResponse:
      type: object
      description: |
        P3-5 composite snapshot. `available=false` means HAL is not
        initialised; sub-sections still carry valid shapes (with
        placeholder values) so the GUI never has to handle a 404 or
        missing-field path.
      properties:
        available:
          type: boolean
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/DriverReadinessRow'
        lab_profile:
          $ref: '#/components/schemas/LabProfileReadiness'
        calibration:
          $ref: '#/components/schemas/CalibrationReadiness'
        dut_attach:
          $ref: '#/components/schemas/DutAttachReadiness'
        generated_at_iso:
          type: string
        subnets:
          type: array
          description: |
            P1-11: per-/24-subnet reachability rollup derived from the
            driver rows. Empty when HAL hasn't initialised or no driver
            carries a parseable IP.
          items:
            $ref: '#/components/schemas/SubnetReachability'
          default: []
      required: [available, drivers, lab_profile, calibration, dut_attach, generated_at_iso, subnets]
    DriverReadinessRow:
      type: object
      properties:
        category:
          type: string
        model:
          type: string
        endpoint:
          type: string
        status:
          type: string
          # P0-2 D5: warn = 驱动可用但默认配置没落上 (apply 失败/binding 选择失效)
          enum: [ok, warn, fail, skipped]
        detail:
          type: string
        fail_kind:
          type: string
          nullable: true
          enum: [network, scpi]
          description: |
            P1-11: when `status == fail`, why. `network` = TCP preflight
            couldn't reach the host (most likely wrong /24 subnet);
            `scpi` = TCP reached but the driver session / *IDN? failed
            (instrument/session problem). `null` whenever status != fail.
        extras:
          type: object
          description: |
            Driver-specific metadata (string-keyed). F64 surfaces
            firmware_version / band_label / product_family from the
            parsed SYST:INFO? response (P3-4); other drivers return an
            empty object until they override `readiness_metadata()`.
            Field values may be null when a driver field is unpopulated.
          additionalProperties: true
          default: {}
      required: [category, model, endpoint, status, detail, fail_kind, extras]
    LabProfileReadiness:
      type: object
      description: |
        Active LabProfile state. `status` distinguishes "no profiles at
        all" (`missing`) from "profiles exist but none active"
        (`inactive`) — different operator next-steps.
      properties:
        profile_id:
          type: string
          nullable: true
        profile_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        status:
          type: string
          enum: [ok, inactive, missing, ambiguous]
        detail:
          type: string
      required: [profile_id, profile_name, is_active, status, detail]
    CalibrationReadiness:
      type: object
      description: |
        Validity of the active lab's bound calibration certificate.
        `no_lab` (no lab to look at a cert through) is distinct from
        `missing` (lab exists but cert FK is NULL) — the former hints
        "set up lab first", the latter hints "run calibration".
      properties:
        certificate_number:
          type: string
          nullable: true
        valid_until_iso:
          type: string
          nullable: true
        status:
          type: string
          enum: [valid, expired, missing, no_lab]
        days_remaining:
          type: integer
          nullable: true
        detail:
          type: string
      required: [certificate_number, valid_until_iso, status, days_remaining, detail]
    DutAttachReadiness:
      type: object
      description: |
        DUT-attach state — placeholder in this build. `status` is
        always `not_implemented` since no runtime model exists for
        "DUT present in chamber" (no probe-sensing / RFID / session
        table). Field is in the contract so future probe-sensing
        work can land without breaking the response shape.
      properties:
        status:
          type: string
          enum: [not_implemented]
        detail:
          type: string
      required: [status, detail]
    SubnetReachability:
      type: object
      description: |
        P1-11/P1-13: per-/24-subnet reachability rollup. Tri-state via
        (`probed`, `reachable`): `probed=false` → no instrument on this subnet
        was actually network-probed (mock-HAL mode, or bindings with no
        parseable host:port) → 未探测/unknown, `reachable` is meaningless (do
        NOT render reachable); `probed=true && reachable=false` → ≥1 preflight
        timed out (no route); `probed=true && reachable=true` → probed alive.
        `hint` is a runbook-pointing string for unreachable subnets, `null`
        otherwise. The sentinel cidr `unknown` buckets rows whose endpoint had
        no parseable IPv4 host.
      properties:
        cidr:
          type: string
          description: '/24 CIDR (e.g. 192.168.0.0/24) or the sentinel "unknown"'
        reachable:
          type: boolean
        instrument_count:
          type: integer
        unreachable_count:
          type: integer
        hint:
          type: string
          nullable: true
        probed:
          type: boolean
          description: 'P1-13: was any instrument on this subnet actually network-probed? false → 未探测/unknown.'
      required: [cidr, reachable, instrument_count, unreachable_count, hint, probed]
    TestExecutionItem:
      type: object
      description: |
        ARCH-1 S2: one execution row from the test_executions table itself
        (case-runner / plan-runner step / commissioning / ad-hoc diagnostic;
        VRT rows excluded via mode IS NULL). Includes running rows. Mirrors
        api-service ExecutionHistoryItem. phases_* null = that execution
        chain does not record phase progress; validation_pass null = not
        judged.
      properties:
        id:
          type: string
        case_name:
          type: string
          nullable: true
        source_test_case_id:
          type: string
          nullable: true
        status:
          type: string
        phases_total:
          type: integer
          nullable: true
        phases_done:
          type: integer
          nullable: true
        phases_failed:
          type: integer
          nullable: true
        duration_sec:
          type: number
          nullable: true
        started_at:
          type: string
          nullable: true
        completed_at:
          type: string
          nullable: true
        executed_by:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        validation_pass:
          type: boolean
          nullable: true
        failure_alert_outcome:
          type: string
          nullable: true
          description: >-
            P2-34: execution-failure alert publication outcome recorded on
            this row (published | duplicate | failed). null = not recorded
            (rows predating P2-34 / record write failed / not applicable) —
            null does NOT mean the alert was published.
      required:
        - id
        - case_name
        - source_test_case_id
        - status
        - phases_total
        - phases_done
        - phases_failed
        - duration_sec
        - started_at
        - completed_at
        - executed_by
        - error_message
        - validation_pass
        - failure_alert_outcome
