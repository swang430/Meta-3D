      required: [test_case_id, policy]
    BaseStationCertificationProofs:
      type: object
      additionalProperties: false
      properties:
        config_readback: {type: boolean}
        route_readback: {type: boolean}
        route_not_applicable: {type: boolean}
        cleanup: {type: boolean}
        transport_release: {type: boolean}
      required: [config_readback, route_readback, route_not_applicable, cleanup, transport_release]
    BaseStationSiteCertification:
      type: object
      additionalProperties: false
      properties:
        schema_version: {type: integer, enum: [1]}
        status: {type: string, enum: [active, revoked]}
        lab_profile_id: {type: string}
        instrument_connection_id: {type: string}
        binding_digest: {type: string}
        adapter_id: {type: string}
        model: {type: string}
        firmware_version: {type: string}
        options: {type: array, items: {type: string}}
        source_execution_id: {type: string}
        evidence_digest: {type: string}
        required_proofs: {$ref: '#/components/schemas/BaseStationCertificationProofs'}
        certified_by: {type: string}
        certified_at: {type: string, format: date-time}
        reason: {type: string}
        revoked_by: {type: string, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        revocation_reason: {type: string, nullable: true}
      required: [schema_version, status, lab_profile_id, instrument_connection_id, binding_digest, adapter_id, model, firmware_version, options, source_execution_id, evidence_digest, required_proofs, certified_by, certified_at, reason]
    BaseStationSiteCertificationCreate:
      type: object
      additionalProperties: false
      properties:
        source_execution_id: {type: string, format: uuid}
        certified_by: {type: string}
        reason: {type: string}
      required: [source_execution_id, certified_by, reason]
    BaseStationSiteCertificationRevoke:
      type: object
      additionalProperties: false
      properties:
        revoked_by: {type: string}
        reason: {type: string}
      required: [revoked_by, reason]
    ExecutionQualification:
      type: object
      additionalProperties: false
      properties:
        schema_version: {type: integer, enum: [1]}
        classification: {type: string, enum: [formal, diagnostic]}
        policy_mode: {type: string, enum: [formal, diagnostic]}
        policy:
          allOf: [{$ref: '#/components/schemas/TestCaseExecutionPolicy'}]
          nullable: true
        binding_digest: {type: string}
        binding_status: {type: string, enum: [configured, not_applicable, diagnostic_unbound]}
        execution_mode: {type: string, enum: [real, simulated]}
        adapter_id: {type: string, nullable: true}
        site_certification:
          allOf: [{$ref: '#/components/schemas/BaseStationSiteCertification'}]
          nullable: true
        site_certification_digest: {type: string, nullable: true}
        reasons: {type: array, items: {type: string}}
        frozen_at: {type: string, format: date-time}
        qualification_digest: {type: string}
      required: [schema_version, classification, policy_mode, policy, binding_digest, binding_status, execution_mode, adapter_id, site_certification, site_certification_digest, reasons, frozen_at, qualification_digest]
    SessionResponse:
